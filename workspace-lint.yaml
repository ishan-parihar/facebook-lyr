project:
  name: "facebook-lyr"
  type: "python-mcp-and-clis"

structure:
  canonical:
    - path: "tests"
      purpose: "Test files"
    - path: "docs"
      purpose: "Documentation, audits, and plans"
    - path: "dist"
      purpose: "Build output"

rules:
  root:
    forbidden_files:
      - "*.log"
      - "*.bak"
      - "*.tmp"
      - "*.old"
      - "*.orig"
      - "*.rej"
      - "*.swp"
      - "*.pid"
      - "*.out"
      - "*.err"
      - "*~"
      - "AUDIT*"
      - "PLAN*"
      - "*REPORT*"
      - "*_v[0-9]*"
      - "*ROADMAP*"
      - "*GUIDE*"
      - "*UPGRADE*"
      - "*DIAGNOSTICS*"
      - "*INTELLIGENCE*"
      - "TOOL_ANALYSIS*"
      - "IMPLEMENTATION_*"
      - "AGENT_GUIDE*"
      - "error.log"
      - "lifeos.config.json"
    allowed_root_files:
      - ".clippy.toml"
      - ".editorconfig"
      - ".env.example"
      - ".eslintrc*"
      - ".gitattributes"
      - ".gitignore"
      - ".gitmodules"
      - ".impeccable.md"
      - ".node-version"
      - ".nvmrc"
      - ".oh-my-opencode-pi-stats.json"
      - ".prettierrc*"
      - ".python-version"
      - ".rustfmt.toml"
      - "AGENTS.md"
      - "BUGS.md"
      - "CHANGELOG.md"
      - "CLAUDE.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "COPYING"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "Justfile"
      - "LICENSE"
      - "LICENSE-*"
      - "LICENSE.md"
      - "Makefile"
      - "NOTICE"
      - "Pipfile"
      - "README.md"
      - "SECURITY.md"
      - "SKILL.md"
      - "TODO.md"
      - "VERSION"
      - "bun.lock"
      - "capacitor.config.json"
      - "clippy.toml"
      - "docker-compose.yaml"
      - "docker-compose.yml"
      - "go.mod"
      - "go.sum"
      - "install.sh"
      - "lifeos.config.default.json"
      - "manifest.json"
      - "package-lock.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements.txt"
      - "rust-toolchain.toml"
      - "setup.cfg"
      - "setup.py"
      - "svelte.config.js"
      - "tsconfig.json"
      - "tsup.config.ts"
      - "uv.lock"
      - "vite.config.ts"
      - "workspace-lint.yaml"
      - "wrangler.toml"
      - "yarn.lock"

  files:
    "*.md":
      preferred_dir: "docs"
      exclude_dirs:
        - ".agents"
        - ".claude"
        - ".contexty"
        - ".cortexkit"
        - ".cursor"
        - ".devin"
        - ".gemini"
        - ".github"
        - ".grader"
        - ".hive"
        - ".impeccable"
        - ".memsearch"
        - ".oh-my-opencode"
        - ".plans"
        - ".serena"
        - ".sisyphus"
        - ".subtaskify"
        - ".superpowers"
        - "dist"
        - "docs"
        - "examples"
        - "facebook_lyr.egg-info"
        - "facebook_mcp_server"
        - "node_modules"
        - "optional-skills"
        - "plugins"
        - "skills"
        - "tests"
    "*.py":
      preferred_dir: "scripts"
      exclude_dirs:
        - ".agents"
        - ".claude"
        - ".contexty"
        - ".cortexkit"
        - ".cursor"
        - ".devin"
        - ".gemini"
        - ".github"
        - ".grader"
        - ".hive"
        - ".impeccable"
        - ".memsearch"
        - ".oh-my-opencode"
        - ".plans"
        - ".serena"
        - ".sisyphus"
        - ".subtaskify"
        - ".superpowers"
        - "dist"
        - "docs"
        - "examples"
        - "facebook_lyr.egg-info"
        - "facebook_mcp_server"
        - "node_modules"
        - "optional-skills"
        - "plugins"
        - "skills"
        - "tests"

  directories:
    forbidden_patterns:
      - "^\\s"
      - "\\s$"

